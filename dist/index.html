  }
  txt('· ' + cur.hint, x + 14, y + 46 + Math.min(4, lines.length) * (fs + 5) + 4, fs, '#b9aecb', 'left');

  /* 底部按钮：翻页 / 开始 */
  var btnH = Math.round(Math.min(50, H * 0.056));
  var by = L.boardY + L.boardW + Math.round(H * 0.012);
  if (by + btnH > H - 10) by = H - btnH - 10;
  rr(L.pad, by, W - L.pad * 2, btnH, btnH / 2);
  ctx.fillStyle = C.amber; ctx.fill();
  txt(page < TUT_RES.length - 1 ? '知道了，下一个 ▶' : '开打 ▶', W / 2, by + btnH * 0.62,
      Math.round(W * 0.043), '#241d2e', 'center', true);
  txt('点屏幕任意处继续', W / 2, by - 8, 10, C.muted, 'center');
}

function drawIntroOverlay(){
  var now = performance.now();
  var fs = Math.max(11, Math.round(W * 0.031));

  /* 其它关：开打前 5 秒倒计时，上方浮一行"本关特色" */
  if (R.intro){
    var left = Math.max(0, R.intro.dur - (now - R.intro.t0));
    var secs = Math.ceil(left / 1000);
    var y = L.giftY + 28;
    rr(L.pad, y, W - L.pad * 2, 26, 13);
    ctx.fillStyle = 'rgba(20,16,28,.78)'; ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(232,172,80,.45)'; ctx.stroke();
    txt('本关特色 · ' + (CHAPTER.brief || ''), L.pad + 14, y + 17, fs, C.amber, 'left', true);
    txt(String(secs), W - L.pad - 14, y + 17, fs + 2, C.ink, 'right', true);
  }

  /* 教学关：第一步指位置，第二步讲资源 */
  if (R.tut && !R.tutSwap) drawTutorialMoveHint(now);
  else if (R.tut && !R.tutUlt) drawTutorialResourcePage(now);
}

var _rpgDrawOverlay = draw;
draw = function(){
  _rpgDrawOverlay();
  if (S.phase === 'play') drawIntroOverlay();
};

/* 抬手时朝对面探身（左右对峙：我方往右、敌方往左），让"要打人了"看得见 */
function lungeDX(o, isFoe){
  if (!o || !(o.windup > 0)) return 0;
  var p = 1 - o.windup / STAGE.windupMs;
  return Math.sin(clamp(p, 0, 1) * Math.PI) * 5 * (isFoe ? -1 : 1);
}

/* ---------- 像素贴图（Tessera 出的 16×16，注入成 64×64 data URL） ----------
   有贴图就画贴图（NEAREST），没有就退回下面那套代码绘制的像素化渲染。
   注意：UNIT_ART 是构建时追加在文件末尾的，本层加载时它还不在 —— 必须"用的时候再读"，
   不能在加载时缓存成局部变量（否则永远是空表，画面全退回矢量）。 */
var ART_IMG = {};
var ART_DIAG = { draws: 0, misses: 0 };

function unitArtMap(){
  if (typeof window === 'undefined') return {};
  if (!window.UNIT_ART) window.UNIT_ART = {};
  return window.UNIT_ART;
}

function unitArtKey(o){
  var line = (o.cls && o.cls !== 'none') ? o.cls : 'none';
  return line + '-' + (o.tier || 1);
}

/* 敌方专用贴图键：foe-<type>-<tier>（Tessera 单独出的敌方造型）
   没有的话退回"我方同款 + 换色"（<cls>-<tier>-foe）。 */
function foeArtKeys(o){
  var out = [];
  if (o && o.type) out.push('foe-' + o.type + '-' + (o.tier || 1));
  out.push(unitArtKey(o) + '-foe');
  out.push(unitArtKey(o));
  return out;
}

/* 按优先级取第一张"存在的"贴图：一旦命中就认它，不再往下退。
   否则贴图还在解码的那几帧会掉到下一档 —— 敌人会短暂变成"我方同款"。 */
function artFromMap(map, keys){
  var k = null;
  for (var i = 0; i < keys.length; i++){
    if (map[keys[i]]){ k = keys[i]; break; }
  }
  if (!k) return null;
  var img = ART_IMG[k];
  if (!img){
    img = new Image();
    img.__ready = false;
    img.onload = function(){ img.__ready = true; };
    img.onerror = function(){ img.__ready = false; };
    img.src = map[k];
    ART_IMG[k] = img;
  }
  return img.__ready ? img : null;
}

/* 预热：进场就把这批敌人 / 我方贴图开始解码，第一帧就不会回退成别的造型 */
function warmUnitArt(list, isFoe){
  if (!list) return;
  for (var i = 0; i < list.length; i++){
    var u = list[i];
    if (u) unitArtImg(unitArtKey(u), isFoe, u);
  }
}

/* 图标（buff-/gear-/mod-/snack-/tool- 前缀）走同一张注入表 */
/* 底部工具条的图标：有像素图标就画图标，没有就退回原来的代码绘制 */
var _drawToolMark = drawToolMark;
drawToolMark = function(cx, cy, s, i, on){
  var id = ['tool-pack', 'tool-hamster', 'tool-gift'][i];
  var ic = iconImg(id);
  if (ic){
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.globalAlpha = on ? 1 : 0.32;
    ctx.drawImage(ic, Math.round(cx - s / 2), Math.round(cy - s / 2), s, s);
    ctx.restore();
    return;
  }
  return _drawToolMark.apply(null, arguments);
};
function iconImg(id){
  if (!id) return null;
  return artFromMap(unitArtMap(), [id]);
}
/* ---------- 多帧动画（新美术包） ----------
   待机 idle1/idle2 每 400ms 交替；出手前 200ms 进 windup；出手后 140ms 显示 strike；
   在本帧里位移过就用 hop（跳跃）。找不到帧就退回静态贴图。 */
function unitFrameName(u, isFoe, now){
  if (isFoe || !u) return null;
  if (u.animStrike && now - u.animStrike < 140) return 'strike';
  var nextAt = 0;
  if (u.atkMs && u.timerMs !== undefined) nextAt = u.atkMs - (u.timerMs || 0);
  else if (u.need && u.atkMs) nextAt = Math.max(0, u.atkMs - (u.timerMs || 0));
  if (u.atkMs && nextAt > 0 && nextAt < 200) return 'windup';
  if (u.movedAt && now - u.movedAt < 180) return 'hop';
  return (Math.floor(now / 400) % 2 === 0) ? 'idle1' : 'idle2';
}

function unitFrameImg(key, frame){
  try {
    var map = window.UNIT_FRAMES;
    if (!map || !map[key] || !frame || !map[key][frame]) return null;
    var id = key + '|' + frame;
    var img = ART_IMG[id];
    if (!img){
      img = new Image();
      img.__ready = false;
      img.onload = function(){ img.__ready = true; };
      img.src = map[key][frame];
      ART_IMG[id] = img;
    }
    return img.__ready ? img : null;
  } catch (e) { return null; }
}

function unitArtImg(key, isFoe, o, now){
  var t = now || performance.now();
  if (!isFoe){
    var fr = unitFrameName(o, isFoe, t);
    var img = fr ? unitFrameImg(key, fr) : null;
    if (img) return img;
  }
  var map = unitArtMap();
  return artFromMap(map, isFoe ? foeArtKeys(o || { cls: key.split('-')[0], tier: 1 }) : [key]);
}

function drawArtImage(img, x, gy, s, dead){
  ctx.save();
  if (dead) ctx.globalAlpha = 0.32;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(img, Math.round(x - s / 2), Math.round(gy - s), s, s);
  ctx.restore();
}

/* 纸箱鼠的"纸箱"：贴图是同一套仓鼠，箱子用几笔代码叠上去，保住原来那个梗 */
function drawCrateTag(x, gy, s){
  var w = 22, h = 15;
  var bx = Math.round(x - w / 2), by = Math.round(gy - s * 0.95);
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#c99a5b'; ctx.fillRect(bx, by, w, h);
  ctx.fillStyle = '#a9762c'; ctx.fillRect(bx, by, w, 3);
  ctx.fillStyle = '#e6cf9e'; ctx.fillRect(bx + w / 2 - 2, by, 4, h);
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(bx, by + h - 2, w, 2);
  ctx.restore();
}

/* ---------- 像素化渲染（真像素，零许可风险） ----------
   做法：把角色本体按 1/scale 的分辨率画进离屏画布，再用 NEAREST 放大回原尺寸。
   64 / 2 = 32 逻辑像素；血条与文字仍走矢量，保持清晰。
   scale 由 game.json 的 rules.artPixelScale 控制（1 = 关闭，回到矢量）。 */
var PIXEL = { canvas: null, ctx: null };

function pixelCtx(){
  if (!PIXEL.ctx){
    var c = document.createElement('canvas');
    c.width = 64; c.height = 64;
    PIXEL.canvas = c;
    PIXEL.ctx = c.getContext('2d');
  }
  return PIXEL.ctx;
}

function drawSpriteArtDirect(o, isFoe, now, x, gy, s, dead){
  ctx.save();
  if (dead) ctx.globalAlpha = 0.32;

  /* 影子 */
  ctx.globalAlpha *= 0.32;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(x, gy + 1, s * 0.3, s * 0.1, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = dead ? 0.32 : 1;

  /* 本体（敌我用同一套画法，靠朝向镜像区分） */
  if (isFoe){
    ctx.save();
    ctx.translate(x, gy - s * 0.86);
    ctx.scale(-1, 1);
    drawFoeArt(0, 0, s, o);
    ctx.restore();
  } else {
    drawHamsterArt(x - s / 2, gy - s * 0.86, s, o);
  }

  /* 手里的武器：抬手时前送、释放后回摆（swing -0.6 → 0.8） */
  var swing = o.windup > 0 ? (-0.6 + (1 - o.windup / STAGE.windupMs) * 1.4) : 0;
  drawWeapon(o.cls || o.line, o.tier || 1,
             x + (isFoe ? -1 : 1) * s * 0.32, gy - s * 0.46,
             s, isFoe ? -1 : 1, swing, isFoe);

  /* 受伤闪一下 */
  if (now < (o.flash || 0)){
    ctx.save();
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x, gy - s * 0.45, s * 0.34, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawSpriteArt(o, isFoe, now, x, gy, s, dead){
  var scale = (RULES.artPixelScale === undefined) ? 2 : Number(RULES.artPixelScale);
  if (!scale || scale <= 1 || typeof document === 'undefined'){
    drawSpriteArtDirect(o, isFoe, now, x, gy, s, dead);
    return;
  }
  /* 抓一块能装下"人 + 挥出去的武器"的区域 */
  var rw = s * 2, rh = s * 1.7;
  var rx = x - rw / 2, ry = gy - s * 1.2;
  var cw = Math.max(8, Math.round(rw / scale)), chh = Math.max(8, Math.round(rh / scale));

  var pc = pixelCtx();
  if (PIXEL.canvas.width !== cw || PIXEL.canvas.height !== chh){
    PIXEL.canvas.width = cw; PIXEL.canvas.height = chh;
  }
  pc.setTransform(1, 0, 0, 1, 0, 0);
  pc.clearRect(0, 0, cw, chh);
  /* 把世界坐标缩进离屏画布：世界 (rx,ry) → 画布 (0,0)，缩比 1/scale */
  pc.setTransform(1 / scale, 0, 0, 1 / scale, -rx / scale, -ry / scale);

  var real = ctx;
  ctx = pc;
  try { drawSpriteArtDirect(o, isFoe, now, x, gy, s, dead); }
  finally { ctx = real; }

  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(PIXEL.canvas, rx, ry, rw, rh);
  ctx.restore();
}

/* ---------- 一个角色的全部画法（以后接美术只需要换这里的两笔） ----------
   没有卡片：本体 + 影子 + 头顶血条 + 脚下出手条 + 名字。
   位置来自 o.x（真的在走），前后深度来自 o.yo。 */
/* 天赋徽章：名字上方一排小片，最多 3 枚，写"硬化 Ⅱ"这种两字 + 罗马数字 */
var TALENT_SHORT = { tank: '硬', blade: '血', shot: '穿', hex: '烬', care: '苏' };
var TALENT_SIDE = { tank: '硬', blade: '嗜', shot: '穿', hex: '烬', care: '苏' };
function talentLabel(id){
  var def = TALENT_DEF[id];
  return def ? def.name : id;
}
/* 精英标记：脚下金环 + 头顶一颗小三角冠 */
function drawEliteMark(x, y, s, now){
  ctx.save();
  ctx.strokeStyle = 'rgba(255,209,102,.85)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(x, y + 2, s * 0.42, s * 0.16, 0, 0, Math.PI * 2);
  ctx.stroke();
  var pulse = 0.6 + 0.4 * Math.sin(now / 240);
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#ffd166';
  var cy = y - s * 0.92, w = s * 0.13;
  ctx.beginPath();
  ctx.moveTo(x - w, cy + w); ctx.lineTo(x, cy - w); ctx.lineTo(x + w, cy + w);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* 增益图标：护甲蓝 / 攻速琥珀 / 暴击绿，画在血条下方 */
function drawBuffIcons(u, x, y, now){
  if (!u) return;
  var marks = [];
  if (u.armorUntil && now < u.armorUntil) marks.push('#9fc6ff');
  if (u.asUntil && now < u.asUntil) marks.push('#e8ac50');
  if (u.critUntil && now < u.critUntil) marks.push('#79c98a');
  if (!marks.length) return;
  var w = 4, gap = 2;
  var total = marks.length * w + (marks.length - 1) * gap;
  var sx = Math.round(x - total / 2), sy = Math.round(y + 6);
  for (var i = 0; i < marks.length; i++){
    ctx.fillStyle = marks[i];
    ctx.fillRect(sx + i * (w + gap), sy, w, 3);
  }
}

function drawTalentBadges(u, x, y){
  if (!u || !u.talents || !u.talents.length) return;
  var roman = ['Ⅰ', 'Ⅱ', 'Ⅲ'];
  var t = u.talents[0];
  if (!t) return;
  var name = talentLabel(t.id);
  var text = name.slice(0, 2) + (roman[Math.min(3, t.lv || 1) - 1] || '');
  if (u.talents.length > 1) text += '+' + (u.talents.length - 1);
  var fs = 7;
  ctx.save();
  ctx.font = fs + 'px sans-serif';
  var w = Math.min(34, ctx.measureText(text).width + 6);
  rr(x - w / 2, y - 8, w, 9, 4);
  ctx.fillStyle = 'rgba(232,172,80,.15)';
  ctx.fill();
  ctx.lineWidth = 0.7;
  ctx.strokeStyle = 'rgba(232,172,80,.5)';
  ctx.stroke();
  txt(text, x, y - 1, fs, '#ffd98a', 'center');
  ctx.restore();
}
function drawUnitSprite(o, isFoe, now){
  var gy = unitY(o);                       /* 脚底就在地面上的 (x, y) */
  var s = STAGE2.sprite * depthScale(gy);  /* 越靠下（越近）越大 */
  var x = unitX(o) + lungeDX(o, isFoe);
  var dead = !o.alive;

  /* 本体：优先用 Tessera 出的像素贴图（64×64，NEAREST）；
     没贴图（或还没加载完）就退回代码绘制的像素化矢量 —— 两条路视觉上都还是像素风。 */
  var art = unitArtImg(unitArtKey(o), isFoe, o, now);
  if (art) ART_DIAG.draws++; else ART_DIAG.misses++;
  if (art) drawArtImage(art, x, gy, s, dead);
  else drawSpriteArt(o, isFoe, now, x, gy, s, dead);
  /* 纸箱鼠还没被破箱时，头上顶个纸箱（贴图统一后靠这几笔保住识别度） */
  if (isFoe && o.type === 'crate' && o.box > 0 && !dead) drawCrateTag(x, gy, s);

  /* 头顶：血条 + 出手/充能条（保持矢量清晰，不做像素化） */
  var bw = Math.max(28, Math.round(s * 0.8));
  var bx = x - bw / 2, by = gy - s * 0.98 - 12;
  bar(bx, by, bw, 3, o.hp / Math.max(1, o.hpMax), isFoe ? '#d96d55' : '#79c98a', 'rgba(0,0,0,.5)');
  if (isFoe){
    var ratio = CFG.realtime ? (o.timerMs / Math.max(1, o.chargeMs)) : (o.charge / Math.max(1, o.chargeMax));
    bar(bx, by + 4, bw, 2, ratio, ratio > 0.72 ? '#ff8a5c' : '#e8ac50', 'rgba(0,0,0,.5)');
  } else if (o.atkMs){
    bar(bx, by + 4, bw, 2, o.timerMs / Math.max(1, o.atkMs), 'rgba(255,255,255,.45)', 'rgba(0,0,0,.5)');
  } else if (o.need){
    bar(bx, by + 4, bw, 2, o.charge / o.need, o.empowered ? '#e8ac50' : '#c7b6ff', 'rgba(0,0,0,.5)');
  }

  /* 强化就绪：脚下一圈光 */
  if (!isFoe && o.empowered){
    ctx.save();
    ctx.strokeStyle = 'rgba(232,172,80,.75)';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.ellipse(x, gy + 1, s * 0.32, s * 0.1, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  if (!isFoe) drawTalentBadges(o, x, by - 6);
  drawBuffIcons(o, x, by + 8, now);
  if (isFoe && o.elite) drawEliteMark(x, gy, s, now);

  /* 名字：只在"需要辨认"的时候才占地方 —— 32px 精灵挤在一起时，标签比角色还宽。
     做法：名字只写名字（职业已经由配色和武器区分），并按站位交错高度，
     同时把字号压小、底色压薄；退场时仍然显示"退场"。 */
  if (STAGE2.sprite >= 48 && !dead) return;   /* 大精灵（64px）时省掉名字，避免和邻居压字 */
  var label = dead ? '退场' : o.name;
  var stagger = ((o.slot || 0) % 2) ? 9 : 0;
  var lx = x;
  var ly = isFoe ? (by - 8 - stagger) : (gy + 11 + stagger);
  var lw = Math.min(84, label.length * 6.4 + 8);
  ctx.save();
  ctx.globalAlpha = 0.45;
  ctx.fillStyle = 'rgba(20,16,28,.85)';
  rr(lx - lw / 2, ly - 7, lw, 9.5, 5);
  ctx.fill();
  ctx.restore();
  txt(label, lx, ly, 8,
      dead ? '#6a6480' : (isFoe ? '#e8a7a7' : '#c6bcd8'), 'center', true);
}

/* 投射物 + 命中环：远程单位真的"打了出去" */
function drawShots(now){
  for (var i = 0; i < R.shots.length; i++){
    var s = R.shots[i];
    var p = clamp((now - s.t0) / Math.max(1, s.dur), 0, 1);
    var x = s.x0 + (s.x1 - s.x0) * p;
    var y = s.y0 + (s.y1 - s.y0) * p - Math.sin(p * Math.PI) * 10;   // 抛物线
    ctx.save();
    /* 拖尾 */
    ctx.strokeStyle = s.hostile ? 'rgba(217,109,85,.45)' : 'rgba(232,172,80,.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - (s.x1 - s.x0) * 0.05, y + 2 + Math.sin(p * Math.PI) * 10 * 0.05);
    ctx.lineTo(x, y);
    ctx.stroke();
    /* 弹体 */
    ctx.fillStyle = s.hostile ? '#d96d55' : '#f0c06a';
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.beginPath(); ctx.arc(x - 1, y - 1, 1.1, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  for (var j = 0; j < R.fx.length; j++){
    var f = R.fx[j];
    var q = clamp((now - f.t0) / f.dur, 0, 1);
    ctx.save();
    ctx.globalAlpha = 1 - q;
    ctx.strokeStyle = '#f0c06a';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(f.x, f.y, 3 + q * 12, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

function drawUnitCard(x, y, u, isFoe, now){
  var hurt = now < u.flash;
  var act = now < u.actFlash;
  rr(x, y, SZ.card, SZ.cardH, 10);
  ctx.fillStyle = hurt ? 'rgba(217,109,85,.22)' : C.panel2;
  ctx.fill();
  ctx.lineWidth = act ? 2 : 1;
  ctx.strokeStyle = act ? C.amber : (hurt ? C.bad : C.line);
  ctx.stroke();

  drawHamsterArt(x + (SZ.card - SZ.art) / 2, y + 6, SZ.art, u);

  /* 卡内底部三条：血条 / 资源强化条 / 出手进度条 */
  var baseY = y + SZ.cardH - 4;
  if (u.eats){
    bar(x + 4, baseY - SZ.slotBar, SZ.card - 8, SZ.slotBar,
        u.charge / Math.max(1, u.need), u.empowered ? C.amber : (u.eats === 'parts' ? '#c7b6ff' : '#ffd98a'), '#2a2338');
    baseY -= SZ.slotBar + 1;
  }
  if (u.atkMs){
    bar(x + 4, baseY - 2, SZ.card - 8, 2, u.timerMs / u.atkMs, 'rgba(255,255,255,.35)', '#2a2338');
    baseY -= 3;
  }
  bar(x + 4, baseY - SZ.hpBar, SZ.card - 8, SZ.hpBar, u.hp / u.hpMax, '#79c98a', '#2a2338');

  txt(u.name, x + SZ.card / 2, y + SZ.cardH + 10, SZ.name, u.alive ? C.muted : '#6a6480', 'center', true);
  if (u.alive){
    var label = u.empowered ? '强化就绪'
      : (u.atkMs ? (Math.max(0, (u.atkMs - u.timerMs) / 1000)).toFixed(1) + 's' : '');
    if (label){
      txt(label, x + SZ.card / 2, y + SZ.cardH + 19, SZ.name,
          u.empowered ? C.amber : '#8f86a6', 'center', true);
    }
  }
  if (!u.alive){
    ctx.fillStyle = 'rgba(20,16,28,.55)';
    rr(x, y, SZ.card, SZ.cardH, 10); ctx.fill();
    txt('累趴', x + SZ.card / 2, y + SZ.cardH / 2 + 3, 9, C.bad, 'center', true);
  }
}

function drawFoeCard(x, y, foe, now){
  var hurt = now < foe.flash;
  var act = now < foe.actFlash;
  rr(x, y, SZ.card, SZ.cardH, 10);
  ctx.fillStyle = hurt ? 'rgba(217,109,85,.22)' : (foe.boss ? 'rgba(217,109,85,.1)' : C.panel2);
  ctx.fill();
  ctx.lineWidth = act ? 2 : 1;
  ctx.strokeStyle = act ? C.bad : (hurt ? C.bad : C.line);
  ctx.stroke();
  drawFoeArt(x + (SZ.card - SZ.art) / 2, y + 6, SZ.art, foe);

  /* 出手倒计时：实时制按毫秒走，条越满越危险 */
  var baseY = y + SZ.cardH - 4;
  var ratio = CFG.realtime
    ? (foe.timerMs / Math.max(1, foe.chargeMs))
    : (foe.charge / Math.max(1, foe.chargeMax));
  var soon = ratio > 0.72;
  bar(x + 4, baseY - SZ.slotBar, SZ.card - 8, SZ.slotBar, ratio,
      soon ? '#ff8a5c' : C.amber, '#2a2338');
  baseY -= SZ.slotBar + 1;
  bar(x + 4, baseY - SZ.hpBar, SZ.card - 8, SZ.hpBar, foe.hp / foe.hpMax, '#d96d55', '#2a2338');

  txt(foe.name, x + SZ.card / 2, y + SZ.cardH + 10, SZ.name, C.muted, 'center', true);
  var cd = CFG.realtime
    ? (Math.max(0, foe.chargeMs - foe.timerMs) / 1000).toFixed(1) + 's'
    : (foe.chargeMax - foe.charge) + '步';
  txt(foe.alive ? cd : '已击退', x + SZ.card / 2, y + SZ.cardH + 19,
      SZ.name, foe.alive ? (soon ? '#ff8a5c' : '#c99') : '#6a6480', 'center');
  if (!foe.alive){
    ctx.fillStyle = 'rgba(20,16,28,.6)';
    rr(x, y, SZ.card, SZ.cardH, 10); ctx.fill();
  }
}

function bar(x, y, w, h, ratio, col, back){
  rr(x, y, w, h, h / 2);
  ctx.fillStyle = back || '#2a2338'; ctx.fill();
  var r = clamp(ratio, 0, 1);
  if (r > 0.02){
    rr(x, y, Math.max(h, w * r), h, h / 2);
    ctx.fillStyle = col; ctx.fill();
  }
}

/* ---------- 17.5 五职业 × 四阶：形态表 + 手里的武器（M6-2） ----------
   白板鼠（tier 1）→ 二级 → 三级 → 四级，每条线 3 次转职、每次换一把武器。
   数值一律走表：这里只声明"这个形态长什么样、有什么手感"，
   具体血量/伤害/间隔都在 ROSTER 里（见文件后段），方便用 __rpgSimAt 调。 */
var CLASS_LINES = ['tank', 'blade', 'shot', 'hex', 'care'];

var CLASS_NAME = {
  none: '白板', tank: '肉盾', blade: '近战', shot: '远程', hex: '魔法', care: '增益'
};

/* 每阶武器名（用于卡面/战报文案，也方便以后接美术按名字找图） */
var WEAPON_NAME = {
  tank:  ['木锅盖', '铁盾 + 短棍', '塔盾 + 钉锤', '铆钉巨盾 + 战锤'],
  blade: ['拳头', '小刀', '斧头', '华丽大宝剑'],
  shot:  ['弹弓', '短弩', '连发弩', '加农炮'],
  hex:   ['火柴', '火把', '电弧线圈', '熔炉核心法杖'],
  care:  ['药膏罐', '针筒', '喷雾罐', '医疗法阵旗']
};

/* 手里那把武器：全部代码矢量，接美术时替换成贴图即可。
   x,y = 手部锚点；s = 角色尺寸；dir = 1 朝右（我方）/ -1 朝左（敌方）。
   swing ∈ [-1,1]：抬手时为负、释放后为正，用来做挥砍/后坐。 */
function drawWeapon(line, tier, x, y, s, dir, swing, isFoe){
  var L = CLASS_LINES.indexOf(line) >= 0 ? line : null;
  if (!L || tier < 2) return;
  var k = s / 54;                       /* 按角色尺寸缩放 */
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(dir, 1);
  ctx.rotate((swing || 0) * 0.5);
  var steel = isFoe ? '#8e8794' : '#c8cfdb';
  var dark  = isFoe ? '#4e4650' : '#6a6f7d';
  var warm  = isFoe ? '#a85a4a' : '#e8ac50';

  if (L === 'blade'){
    if (tier === 2){                    /* 小刀 */
      ctx.strokeStyle = steel; ctx.lineWidth = 3 * k;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(15 * k, -2 * k); ctx.stroke();
    } else if (tier === 3){             /* 斧头 */
      ctx.strokeStyle = dark; ctx.lineWidth = 3.4 * k;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(13 * k, -3 * k); ctx.stroke();
      ctx.fillStyle = steel;
      ctx.beginPath();
      ctx.moveTo(10 * k, -12 * k); ctx.lineTo(20 * k, -6 * k);
      ctx.lineTo(20 * k, 4 * k); ctx.lineTo(10 * k, 8 * k); ctx.closePath(); ctx.fill();
    } else {                            /* 华丽大宝剑 */
      ctx.strokeStyle = dark; ctx.lineWidth = 3 * k;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(6 * k, -2 * k); ctx.stroke();
      ctx.fillStyle = steel;
      ctx.beginPath();
      ctx.moveTo(6 * k, -3 * k); ctx.lineTo(30 * k, -1 * k);
      ctx.lineTo(36 * k, 1.5 * k); ctx.lineTo(30 * k, 4 * k); ctx.lineTo(6 * k, 5 * k);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = warm; ctx.lineWidth = 1.6 * k;
      ctx.beginPath(); ctx.moveTo(6 * k, -7 * k); ctx.lineTo(6 * k, 9 * k); ctx.stroke();
      if (isFoe) { ctx.fillStyle = 'rgba(255,60,70,.5)'; }
      else { ctx.fillStyle = 'rgba(232,172,80,.45)'; }
      ctx.beginPath(); ctx.arc(33 * k, 1.5 * k, 2.4 * k, 0, Math.PI * 2); ctx.fill();
    }
  } else if (L === 'tank'){
    var w = (tier === 2 ? 11 : tier === 3 ? 14 : 17) * k;
    var h = (tier === 2 ? 15 : tier === 3 ? 19 : 23) * k;
    ctx.fillStyle = steel;
    ctx.beginPath();
    ctx.moveTo(-2 * k, -h / 2); ctx.lineTo(w, -h / 2 + 2 * k);
    ctx.lineTo(w, h / 2 - 2 * k); ctx.lineTo(-2 * k, h / 2); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = dark; ctx.lineWidth = 1.6 * k; ctx.stroke();
    if (tier >= 3){                      /* 钉锤 */
      ctx.fillStyle = dark;
      ctx.fillRect(-6 * k, -2 * k, 8 * k, 3 * k);
      ctx.beginPath(); ctx.arc(-8 * k, -0.5 * k, 3.4 * k, 0, Math.PI * 2); ctx.fill();
    }
    if (tier === 4){                     /* 铆钉 */
      ctx.fillStyle = warm;
      for (var i = 0; i < 3; i++){
        ctx.beginPath(); ctx.arc(w * 0.35 + i * 3.4 * k, -h * 0.3 + i * 4 * k, 1.3 * k, 0, Math.PI * 2); ctx.fill();
      }
    }
  } else if (L === 'shot'){
    if (tier === 2){                     /* 短弩 */
      ctx.strokeStyle = dark; ctx.lineWidth = 3 * k;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(14 * k, -2 * k); ctx.stroke();
      ctx.strokeStyle = steel; ctx.lineWidth = 2 * k;
      ctx.beginPath(); ctx.arc(11 * k, -2 * k, 7 * k, -1.1, 1.1); ctx.stroke();
    } else if (tier === 3){              /* 连发弩 */
      ctx.strokeStyle = dark; ctx.lineWidth = 3 * k;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(16 * k, -2 * k); ctx.stroke();
      ctx.strokeStyle = steel; ctx.lineWidth = 2 * k;
      ctx.beginPath(); ctx.arc(12 * k, -2 * k, 8 * k, -1.0, 1.0); ctx.stroke();
      ctx.beginPath(); ctx.arc(12 * k, -2 * k, 5 * k, -1.0, 1.0); ctx.stroke();
    } else {                             /* 加农炮 */
      ctx.fillStyle = dark;
      ctx.fillRect(0, -5 * k, 22 * k, 9 * k);
      ctx.fillStyle = steel;
      ctx.beginPath(); ctx.arc(22 * k, -0.5 * k, 5 * k, -Math.PI / 2, Math.PI / 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,180,90,.55)';
      ctx.beginPath(); ctx.arc(25 * k, -0.5 * k, 3 * k, 0, Math.PI * 2); ctx.fill();
    }
  } else if (L === 'hex'){
    ctx.strokeStyle = dark; ctx.lineWidth = 2.6 * k;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(16 * k, -6 * k); ctx.stroke();
    var core = isFoe ? '#ff5468' : '#ffd27a';
    ctx.fillStyle = core;
    ctx.beginPath(); ctx.arc(18 * k, -7 * k, (tier === 2 ? 2.4 : tier === 3 ? 3.4 : 5) * k, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,210,122,.45)';
    ctx.lineWidth = 1.2 * k;
    if (tier >= 3){
      ctx.beginPath(); ctx.arc(18 * k, -7 * k, 7 * k, -0.8, 0.8); ctx.stroke();
    }
    if (tier === 4){
      ctx.beginPath(); ctx.arc(18 * k, -7 * k, 10 * k, 0, Math.PI * 2); ctx.stroke();
    }
  } else if (L === 'care'){
    if (tier === 2){                     /* 针筒 */
      ctx.fillStyle = steel;
      ctx.fillRect(0, -2 * k, 14 * k, 4 * k);
      ctx.strokeStyle = dark; ctx.lineWidth = 1.6 * k;
      ctx.beginPath(); ctx.moveTo(14 * k, 0); ctx.lineTo(19 * k, 0); ctx.stroke();
    } else if (tier === 3){              /* 喷雾罐 */
      ctx.fillStyle = steel;
      rr(0, -5 * k, 10 * k, 10 * k, 2 * k); ctx.fill();
      ctx.fillStyle = warm;
      ctx.beginPath(); ctx.arc(14 * k, -6 * k, 2.2 * k, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(17 * k, -9 * k, 1.6 * k, 0, Math.PI * 2); ctx.fill();
    } else {                             /* 医疗法阵旗 */
      ctx.strokeStyle = dark; ctx.lineWidth = 2.2 * k;
      ctx.beginPath(); ctx.moveTo(0, 4 * k); ctx.lineTo(0, -18 * k); ctx.stroke();
      ctx.fillStyle = isFoe ? '#a85a4a' : '#79c98a';
      rr(0, -18 * k, 14 * k, 9 * k, 1.6 * k); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillRect(6 * k, -16.5 * k, 2 * k, 6 * k);
      ctx.fillRect(4 * k, -14.5 * k, 6 * k, 2 * k);
    }
  }
  ctx.restore();
}

/* ---------- 16. 矢量角色（占位美术，尺寸由 SZ.art 控制） ---------- */
function drawHamsterArt(x, y, s, u){
  ctx.save();
  ctx.translate(x, y);
  /* 耳朵 */
  ctx.fillStyle = '#c98f5e';
  ctx.beginPath(); ctx.arc(s * 0.24, s * 0.2, s * 0.13, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.76, s * 0.2, s * 0.13, 0, Math.PI * 2); ctx.fill();
  /* 身体 */
  rr(0, s * 0.14, s, s * 0.8, s * 0.32);
  ctx.fillStyle = u.line === 'wrench' ? '#cfd4de' : '#e5b982';
  ctx.fill();
  ctx.lineWidth = 1.4;
  ctx.strokeStyle = u.line === 'wrench' ? '#7c8494' : '#a9762c';
  ctx.stroke();
  /* 脸颊 */
  ctx.fillStyle = '#f4dcc0';
  ctx.beginPath(); ctx.arc(s * 0.5, s * 0.64, s * 0.28, 0, Math.PI * 2); ctx.fill();
  /* 眼睛 */
  ctx.fillStyle = '#2a2338';
  ctx.beginPath(); ctx.arc(s * 0.35, s * 0.5, s * 0.07, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.65, s * 0.5, s * 0.07, 0, Math.PI * 2); ctx.fill();

  /* 职业标识：只用 2~3 笔，缩到 42px 还认得出 */
  if (u.line === 'wrench'){
    ctx.strokeStyle = '#7c8494'; ctx.lineWidth = s * 0.09;
    ctx.beginPath(); ctx.moveTo(s * 0.2, s * 0.9); ctx.lineTo(s * 0.8, s * 0.9); ctx.stroke();
    ctx.fillStyle = '#8e97a8';
    for (var i = 0; i < 3; i++){
      ctx.beginPath(); ctx.arc(s * (0.28 + i * 0.22), s * 0.9, s * 0.045, 0, Math.PI * 2); ctx.fill();
    }
  } else if (u.line === 'driver'){
    ctx.fillStyle = '#8e97a8';
    rr(s * 0.62, s * 0.42, s * 0.44, s * 0.16, s * 0.06); ctx.fill();
    ctx.fillStyle = '#ffd98a';
    ctx.beginPath(); ctx.arc(s * 0.32, s * 0.62, s * 0.09, 0, Math.PI * 2); ctx.fill();
  } else if (u.line === 'spring'){
    ctx.strokeStyle = '#ffd98a'; ctx.lineWidth = s * 0.06;
    ctx.beginPath();
    for (var k = 0; k <= 6; k++){
      var px = s * (0.24 + k * 0.09), py = s * (0.86 + ((k % 2) ? -0.05 : 0.05));
      if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
  } else if (u.line === 'medic'){
    ctx.fillStyle = '#e37b6d';
    ctx.fillRect(s * 0.46, s * 0.6, s * 0.08, s * 0.24);
    ctx.fillRect(s * 0.38, s * 0.68, s * 0.24, s * 0.08);
  } else if (u.line === 'sack'){
    ctx.fillStyle = '#a48b6a';
    rr(s * 0.66, s * 0.62, s * 0.3, s * 0.28, s * 0.08); ctx.fill();
  }
  ctx.restore();
}

function drawFoeArt(x, y, s, foe){
  ctx.save();
  ctx.translate(x, y);
  var body = '#9aa0ad';
  ctx.fillStyle = body;
  rr(s * 0.08, s * 0.3, s * 0.84, s * 0.66, s * 0.3); ctx.fill();
  ctx.lineWidth = 1.4; ctx.strokeStyle = '#5c6270'; ctx.stroke();
  /* 耳朵 */
  ctx.fillStyle = '#8b91a0';
  ctx.beginPath(); ctx.arc(s * 0.26, s * 0.3, s * 0.12, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.74, s * 0.3, s * 0.12, 0, Math.PI * 2); ctx.fill();
  /* 眼睛（尖牙帮统一：红豆眼） */
  ctx.fillStyle = '#ff6f61';
  ctx.beginPath(); ctx.arc(s * 0.35, s * 0.58, s * 0.075, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.65, s * 0.58, s * 0.075, 0, Math.PI * 2); ctx.fill();
  /* 尖牙 */
  ctx.fillStyle = '#fff4e2';
  ctx.beginPath();
  ctx.moveTo(s * 0.44, s * 0.78); ctx.lineTo(s * 0.5, s * 0.88); ctx.lineTo(s * 0.56, s * 0.78);
  ctx.closePath(); ctx.fill();

  if (foe.type === 'crate'){
    /* 纸箱头盔 */
    ctx.fillStyle = '#c19a63';
    rr(s * 0.14, s * 0.04, s * 0.72, s * 0.36, s * 0.05); ctx.fill();
    ctx.strokeStyle = '#8d6b3c'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s * 0.5, s * 0.06); ctx.lineTo(s * 0.5, s * 0.38); ctx.stroke();
    if (foe.box > 0){ ctx.fillStyle = 'rgba(193,154,99,.55)'; rr(s * 0.1, s * 0.02, s * 0.8, s * 0.4, s * 0.06); ctx.fill(); }
  } else if (foe.type === 'shell'){
    /* 背上的果壳堆 */
    ctx.fillStyle = '#b98b5e';
    for (var i = 0; i < 3; i++){
      ctx.beginPath();
      ctx.ellipse(s * (0.3 + i * 0.2), s * 0.26, s * 0.1, s * 0.07, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (foe.boss){
    /* 机械臂：方头 + 液压杆 */
    ctx.fillStyle = '#8e97a8';
    rr(s * 0.2, s * 0.06, s * 0.6, s * 0.3, s * 0.08); ctx.fill();
    ctx.strokeStyle = '#5c6270'; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.strokeStyle = '#ffd98a'; ctx.lineWidth = s * 0.08;
    ctx.beginPath(); ctx.moveTo(s * 0.86, s * 0.5); ctx.lineTo(s * 0.98, s * 0.78); ctx.stroke();
  }
  ctx.restore();
}

/* ---------- 17. 顶栏接管：敌方血条取代"进度" ---------- */
drawHeader = function(){
  var p = L.pad, y = Math.round(L.headerH * 0.42);
  txt('第 ' + S.level + ' 关 · ' + CHAPTER.name, p, y, Math.round(W * 0.043), C.ink, 'left', true);
  txt('消除 ' + (S.swapCount || 0) + ' 次 · 无限步', W - p, y, Math.round(W * 0.034), C.muted, 'right', true);

  var bh = Math.max(12, Math.round(H * 0.017));
  var by = y + Math.round(H * 0.018);
  var fs = Math.max(10, Math.round(W * 0.031));
  var target = aliveEnemies()[0];
  var name = target ? target.name : (R.queue.length ? R.queue[0].name : '下一波待命');
  var hp = target ? target.hp : 0;
  var hpMax = target ? target.hpMax : 1;
  var lbl = '存活 ' + aliveUnits().length + '/' + R.units.filter(Boolean).length +
            (target ? ' · ' + name + ' ' + Math.max(0, Math.round(hp)) + '/' + hpMax : '');
  ctx.font = '700 ' + fs + 'px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  var lw = ctx.measureText(lbl).width;
  var bw = Math.max(60, W - p * 2 - lw - 10);

  rr(p, by, bw, bh, bh / 2); ctx.fillStyle = C.panel2; ctx.fill();
  var ratio = clamp((target ? hp : 0) / Math.max(1, hpMax), 0, 1);
  if (ratio > 0){
    rr(p, by, Math.max(bh, bw * ratio), bh, bh / 2);
    ctx.fillStyle = C.bad; ctx.fill();
  }
  txt(lbl, W - p, by + bh - Math.round(bh * 0.2), fs, C.muted, 'right', true);
};

/* ---------- 18. 结算卡片：换成 RPG 数据 ---------- */
drawEnd = function(){
  var win = S.phase === 'win';
  var padIn = 22;
  var wCard = w0();
  var titleSize = Math.round(W * 0.052);
  var rowSize = Math.max(11, Math.round(W * 0.034));
  var lh = Math.round(rowSize * 1.85);

  var rows = [
    ['波次', Math.min(R.waveTotal, R.wave + (win ? 1 : 0)) + ' / ' + R.waveTotal],
    ['击退鼠群', R.kills + ' 只'],
    ['累计伤害', Math.round(R.dmgDealt)],
    ['存活仓鼠', aliveUnits().length + ' / ' + R.units.filter(Boolean).length]
  ];
  var btnH = Math.round(Math.min(44, W * 0.115));
  var yTitle = 40, ySub = yTitle + 30;
  var yRows = ySub + 26;
  var h = yRows + rows.length * lh + 16 + btnH + 22;
  h = Math.min(h, Math.round(H * 0.9));

  var box = cardBox(h);
  var x = box[0], y = box[1], w = box[2];

  txt(win ? '守住了' : '全队阵亡', W / 2, y + yTitle, titleSize, win ? C.amber : C.bad, 'center', true);
  txt(CHAPTER.name + ' · 第 ' + S.level + ' 关', W / 2, y + ySub, Math.round(W * 0.036), C.muted, 'center', true);

  for (var i = 0; i < rows.length; i++){
    txt(rows[i][0], x + padIn, y + yRows + i * lh, rowSize, C.muted, 'left');
    txt(String(rows[i][1]), x + w - padIn, y + yRows + i * lh, rowSize, C.ink, 'right', true);
  }

  var bw = Math.round(w * 0.52), bh = btnH;
  var bx = W / 2 - bw / 2, byy = y + h - bh - 22;
  rr(bx, byy, bw, bh, bh / 2);
  ctx.fillStyle = win ? C.amber : C.panel;
  ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = C.amber; ctx.stroke();
  txt(win ? '再开一厂' : '重新开工', bx + bw / 2, byy + bh * 0.66,
      Math.max(12, Math.round(W * 0.038)), win ? '#241d2e' : C.amber, 'center', true);
  HIT.again = [bx, byy, bw, bh];
};

/* ---------- 19. 大招：能量满点按钮 ---------- */
function useUlt(){
  if (S.phase !== 'play' || S.anim) return false;
  if (R.mod && R.mod.noUlt) return false;       // 某些关卡停电：大招停用
  if (R.energy < CFG.ult.cost) return false;
  R.energy = 0;
  var list = aliveEnemies();
  /* 5 人版：伤害随上阵人数走，别让"少上人"变成更划算的选择 */
  var dmg = 14 + 4 * aliveUnits().length;
  for (var i = 0; i < list.length; i++) hurtFoe(list[i], dmg, true);
  if (R.tut) R.tutUlt = true;
  R.ultFlash = performance.now() + 420;
  floatText('全厂爆产 ' + dmg, W / 2, L.giftY + L.giftH * 0.22, C.amber, true);
  sfx('tool');
  checkBattleEnd();
  return true;
}

canvas.addEventListener('pointerdown', function(e){
  try {
    var rect = canvas.getBoundingClientRect();
    var pt = [e.clientX - rect.left, e.clientY - rect.top - SAFE_TOP];
    if (HIT.ult && inRect(pt, HIT.ult)){
      var blockedNow = explainUlt();          /* 停电关：先说清原因 */

/* 真·像素化：把画布按 grid 网格重新落色 + alpha 二值化（半透明边缘一律砍掉）。
   这是"矢量画"和"像素画"的区别所在：像素画必须有网格和限色。 */
var SPRITE_PALETTE = [
  [42, 35, 56], [26, 21, 36], [60, 50, 80], [96, 78, 116], [140, 120, 160], [176, 160, 196],
  [229, 185, 130], [201, 143, 94], [244, 220, 192], [255, 255, 255],
  [200, 207, 219], [138, 146, 160], [106, 111, 125], [78, 70, 80],
  /* 描边色：矢量原稿的棕描边与铁灰描边，少了它们像素化后轮廓会偏红 */
  [169, 118, 44], [124, 132, 148], [142, 151, 168],
  [232, 172, 80], [255, 217, 138], [255, 209, 102],
  [122, 201, 138], [159, 198, 255], [199, 182, 255],
  [217, 109, 85], [255, 157, 138], [179, 64, 47], [142, 135, 148]
];

function pixelateCanvas(g, size){
  var img;
  try { img = g.getImageData(0, 0, size, size); } catch (e) { return; }
  var d = img.data;
  for (var i = 0; i < d.length; i += 4){
    if (d[i + 3] < 128){ d[i] = d[i + 1] = d[i + 2] = 0; d[i + 3] = 0; continue; }
    d[i + 3] = 255;
    var r = d[i], gg = d[i + 1], b = d[i + 2], best = 0, bd = Infinity;
    for (var p = 0; p < SPRITE_PALETTE.length; p++){
      var pr = SPRITE_PALETTE[p][0], pg = SPRITE_PALETTE[p][1], pb = SPRITE_PALETTE[p][2];
      var dist = (r - pr) * (r - pr) + (gg - pg) * (gg - pg) + (b - pb) * (b - pb);
      if (dist < bd){ bd = dist; best = p; }
    }
    d[i] = SPRITE_PALETTE[best][0];
    d[i + 1] = SPRITE_PALETTE[best][1];
    d[i + 2] = SPRITE_PALETTE[best][2];
  }
  g.putImageData(img, 0, 0);
}

/* 先按 grid（比如 27）画，落色成像素；再 NEAREST 放大到 out 尺寸 */
function makePixelSprite(line, tier, grid, out, isFoe){
  grid = Math.max(8, Math.round(grid));
  out = Math.max(grid, Math.round(out || grid));
  var small = document.createElement('canvas');
  small.width = grid; small.height = grid;
  renderSpriteTo(small, line, tier, grid, isFoe);
  pixelateCanvas(small.getContext('2d'), grid);
  if (out === grid) return small;
  var big = document.createElement('canvas');
  big.width = out; big.height = out;
  var bg = big.getContext('2d');
  bg.imageSmoothingEnabled = false;
  bg.drawImage(small, 0, 0, out, out);
  return big;
}

window.__spritePNG = function(line, tier, grid, out, isFoe){
  return makePixelSprite(line, tier, grid || 27, out || (grid || 27) * 4, isFoe).toDataURL('image/png');
};

window.__spriteSheetPNG = function(grid, cols, out){
  grid = Math.max(8, Math.round(grid || 27));
  out = Math.max(grid, Math.round(out || grid * 4));
  cols = cols || 4;
  var rows = Math.ceil(SPRITE_FORMS.length / cols);
  var pad = Math.round(out * 0.16);
  var W2 = cols * (out + pad) + pad, H2 = rows * (out + pad) + pad;
  var sheet = document.createElement('canvas');
  sheet.width = W2; sheet.height = H2;
  var sg = sheet.getContext('2d');
  sg.imageSmoothingEnabled = false;
  sg.fillStyle = '#241d2e'; sg.fillRect(0, 0, W2, H2);
  for (var i = 0; i < SPRITE_FORMS.length; i++){
    var f = SPRITE_FORMS[i];
    var cell = makePixelSprite(f.line, f.tier, grid, out, false);
    var cx = pad + (i % cols) * (out + pad);
    var cy = pad + Math.floor(i / cols) * (out + pad);
    sg.drawImage(cell, cx, cy, out, out);
  }
  return { png: sheet.toDataURL('image/png'), w: W2, h: H2, forms: SPRITE_FORMS.slice() };
};

/* 转职证的阶与解锁关卡：T2 第 1 关、T3 第 3 关、T4 第 6 关 */
var TIER_UNLOCK = { 2: 1, 3: 3, 4: 6 };

/* ---------- 3. 商店存档（v2：5 个上阵位 + 大厅位用 -1 表示） ---------- */
/* ---------- 碎片（P1）：分解仓鼠 / 道具池产出；兑换按池定价 ---------- */
var SHARD_KEY = 'hamsterSnackFactory.shard.v1';
function shardLoad(){
  try {
    var raw = localStorage.getItem(SHARD_KEY);
    if (raw){
      var o = JSON.parse(raw);
      SHOP.shard = Math.max(0, o.shard | 0);
      SHOP.gachaPity = (o.gachaPity | 0) || 0;
    }
  } catch (e) {}
  if (typeof SHOP.shard !== 'number') SHOP.shard = 0;
  if (typeof SHOP.gachaPity !== 'number') SHOP.gachaPity = 0;
  if (typeof SHOP.tier2Pity !== 'number') SHOP.tier2Pity = 0;
}
function shardSave(){
  try {
    localStorage.setItem(SHARD_KEY, JSON.stringify({ shard: SHOP.shard | 0, gachaPity: SHOP.gachaPity | 0 }));
  } catch (e) {}
}
function addShard(n){
  SHOP.shard = Math.max(0, Math.round((SHOP.shard || 0) + n));
  shardSave();
  return SHOP.shard;
}
/* 分解价目：2×槽数 + 1×(总等级−槽数)，上限 12 */
function shardValueOf(rat){
  var list = (rat && rat.talents) ? rat.talents : [];
  var slots = list.length;
  if (!slots) return 1;                       /* 白板鼠也给 1，别让玩家觉得白抽 */
  var sum = 0;
  for (var i = 0; i < list.length; i++) sum += (list[i].lv || 1);
  var cfg = (RULES && RULES.shard) || {};
  var base = (cfg.decompBase || 2) * slots + (cfg.decompPerLevel || 1) * (sum - slots);
  return Math.min(cfg.cap || 12, Math.max(1, base));
}
/* ---------- 仓鼠池（P2）与炼妖（P3）的核心逻辑 ---------- */
var RAT_LINES = ['tank', 'blade', 'shot', 'hex', 'care'];

function gachaCfg(){
  var cfg = (RULES && RULES.gacha) || {};
  return {
    rat: cfg.rat || { cost: 60, tenCost: 540, pityDouble: 20, shardCost: 12 },
    item: cfg.item || { cost: 20, tenCost: 180, pityGear: 10, shardCost: 5 }
  };
}

/* 槽位：5% 三天赋 / 13% 双天赋 / 82% 单天赋（合起来 P3=5%、P2=18%） */
function rollTalentSlots(){
  var r = Math.random();
  if (r < 0.05) return 3;
  if (r < 0.18) return 2;
  return 1;
}
/* 等级：62% Ⅰ / 30% Ⅱ / 8% Ⅲ */
function rollTalentGrade(){
  var r = Math.random();
  if (r < 0.62) return 1;
  if (r < 0.92) return 2;
  return 3;
}

/* 生成一只新仓鼠（职业随机，天赋按规则掷） */
/* ---------- 技能（S2：只携带与展示，战斗生效在 S4–S6） ---------- */
function skillDefs(){ return (RULES.skills && RULES.skills.list) || {}; }
function skillList(){ return Object.keys(skillDefs()); }
function skillName(id){ var d = skillDefs()[id]; return d ? d.name : id; }
function skillKindLabel(kind){ return kind === 'mag' ? '魔法' : (kind === 'buff' ? '增益' : '物理'); }

/* 数量：30% 0 个 / 42% 1 个 / 22% 2 个 / 6% 3 个 */
function rollSkillCount(){
  var c = (RULES.gacha && RULES.gacha.rat && RULES.gacha.rat.slots) || { p0: 0.30, p1: 0.42, p2: 0.22, p3: 0.06 };
  var r = Math.random();
  if (r < c.p0) return 0;
  if (r < c.p0 + c.p1) return 1;
  if (r < c.p0 + c.p1 + c.p2) return 2;
  return 3;
}
function rollSkills(n){
  var pool = skillList();
  var out = [];
  for (var i = 0; i < n && pool.length; i++){
    var k = Math.floor(Math.random() * pool.length);
    var id = pool.splice(k, 1)[0];
    out.push({ id: id, lv: rollTalentGrade() });
  }
  return out;
}

function rollRat(){
  var cfg = (RULES.gacha && RULES.gacha.rat) || {};
  var p2 = typeof cfg.tier2 === 'number' ? cfg.tier2 : 0.08;
  var p3 = typeof cfg.tier3 === 'number' ? cfg.tier3 : 0.005;
  var pityMax = cfg.tier2Pity || 10;

  /* 三档：三级 0.5% / 二级 8% / 其余白板 */
  var r = Math.random();
  var tier = 1;
  if (r < p3) tier = 3;
  else if (r < p3 + p2) tier = 2;

  /* 保底：累计 10 抽没出 ≥二级 → 这一抽强制二级 */
  SHOP.tier2Pity = (SHOP.tier2Pity | 0) + 1;
  var forced = SHOP.tier2Pity >= pityMax && tier === 1;
  if (forced) tier = 2;
  if (tier >= 2) SHOP.tier2Pity = 0;

  var line = RAT_LINES[Math.floor(Math.random() * RAT_LINES.length)];

  /* 天赋：二级/三级必带职业天赋；其余按老规则随机携带 */
  var talents = [];
  if (tier >= 2){
    talents.push({ id: line, lv: rollTalentGrade() });
    /* 二级/三级再抽 0–2 条跨线天赋（跟白板同表，只是先占掉一条职业天赋） */
    var extra = rollTalentSlots() - 1;
    var pool = RAT_LINES.filter(function(l){ return l !== line; });
    for (var i = 0; i < extra && pool.length; i++){
      var k = Math.floor(Math.random() * pool.length);
      talents.push({ id: pool.splice(k, 1)[0], lv: rollTalentGrade() });
    }
  } else {
    var n = rollTalentSlots();
    var pool0 = RAT_LINES.slice();
    for (var j = 0; j < n && pool0.length; j++){
      var k0 = Math.floor(Math.random() * pool0.length);
      talents.push({ id: pool0.splice(k0, 1)[0], lv: rollTalentGrade() });
    }
    line = 'none';
  }

  /* 技能：三档同一张表 */
  var skills = rollSkills(rollSkillCount());

  return { line: line, tier: tier, mod: '', talents: talents, skills: skills, tierRoll: tier };
}


/* 抽一次仓鼠（花 60 金币或外部已经扣碎片） */
function ratGachaRoll(){
  var cost = gachaCfg().rat.cost;
  if (SHOP.coins < cost){ sfx('invalid'); return null; }
  SHOP.coins -= cost;
  return ratGachaApply();
}

/* 不扣钱、直接出结果（十连 / 碎片兑换都走这里） */
function ratGachaApply(forceTier2){
  var rat = rollRat();
  if (forceTier2 && rat.tier < 2){
    rat.tier = 2;
    rat.line = RAT_LINES[Math.floor(Math.random() * RAT_LINES.length)];
    if (!rat.talents.some(function(t){ return t.id === rat.line; })){
      rat.talents.unshift({ id: rat.line, lv: rollTalentGrade() });
    }
  }
  var full = (SHOP.rats.length >= rosterCap()) && (boxList().length >= boxCap());
  var result = { rat: rat, shard: 0, full: full };
  if (full){
    /* 队伍满了：直接折碎片，别让玩家白抽 */
    result.shard = shardValueOf(rat);
    addShard(result.shard);
  } else if (SHOP.rats.length < rosterCap()){
    SHOP.rats.push(rat);
    SHOP.sel = SHOP.rats.length - 1;
    markFresh(SHOP.sel);
    result.index = SHOP.sel;
  } else {
    /* 仓鼠栏满：进仓鼠盒（盒子也满了才折碎片） */
    var bi = boxAdd(rat);
    if (bi >= 0){
      result.boxed = true;
      result.boxIndex = bi;
    } else {
      result.shard = shardValueOf(rat);
      addShard(result.shard);
    }
  }
  /* Ⅲ 级：记下来给播报用 */
  for (var ti = 0; ti < rat.talents.length; ti++){
    if ((rat.talents[ti].lv || 1) >= 3){
      result.t3 = (TALENT_DEF[rat.talents[ti].id] ? TALENT_DEF[rat.talents[ti].id].name : rat.talents[ti].id);
      result.t0 = performance.now();
      break;
    }
  }
  GACHA_LAST.push(result);
  rebuildUnitsIfShop();
  shopSave();
  sfx('pick');
  return result;
}

var GACHA_LAST = [];

/* 十连：一次扣钱，连续出 10 只 */
function ratGachaTen(){
  var cfg = gachaCfg().rat;
  var cost = cfg.tenCost || (cfg.cost * 9);
  if (SHOP.coins < cost){ sfx('invalid'); return []; }
  SHOP.coins -= cost;
  GACHA_LAST = [];
  var sawTier2 = false;
  for (var i = 0; i < 10; i++){
    var last = (i === 9);
    var res = ratGachaApply(last && !sawTier2);
    if (res && res.rat && res.rat.tier >= 2) sawTier2 = true;
  }
  return GACHA_LAST.slice();
}

/* ---------- 炼妖：主鼠槽1 固定，其余按概率继承 ---------- */
function fusePreview(mainIdx, subIdx){
  var a = SHOP.rats[mainIdx], b = SHOP.rats[subIdx];
  if (!a || !b || mainIdx === subIdx) return null;
  var rows = [];
  /* 槽1 保留且等级取主鼠的（以前这里写死 1，会把 Ⅲ 级洗成 Ⅰ） */
  var s1 = (a.talents && a.talents[0]) ? a.talents[0] : null;
  var s1lv = s1 ? (s1.lv || 1) : 1;
  var s1id = s1 ? s1.id : a.line;
  /* 副鼠若也带这条天赋，等级取较高的那条 */
  for (var si = 0; si < (b.talents || []).length; si++){
    if (b.talents[si].id === s1id) s1lv = Math.max(s1lv, b.talents[si].lv || 1);
  }
  rows.push({ id: s1id, lv: s1lv, who: '主', chance: 1 });
  var extras = [];
  var push = function(list, who, chance){
    for (var i = 0; i < (list || []).length; i++){
      var t = list[i];
      var isSlot1 = (who === '主' && i === 0);
      if (isSlot1) continue;
      extras.push({ id: t.id, lv: t.lv || 1, who: who, chance: chance });
    }
  };
  var fc = (RULES.fuse) || {};
  push(a.talents, '主', fc.keepMain || 0.70);
  push(b.talents, '副', fc.keepSub || 0.55);
  return {
    main: a, sub: b, slot1: rows[0], extras: extras,
    skillsMain: (a.skills || []).slice(),
    skillsSub: (b.skills || []).slice(),
    eatSkill: (typeof fc.eatSkill === 'number') ? fc.eatSkill : 0.08,
    eatTalent: (typeof fc.eatTalent === 'number') ? fc.eatTalent : 0.025,
    cost: fc.cost || 30, refund: fc.refundIfNone || 3
  };
}

/* ---------- 天赋洗练（P5）：花碎片重掷某一槽的等级，可升可降 ---------- */
var REROLL_COST = 6;
var REROLL_ARM = '';        /* 两段确认：第一次点只是"上膛" */

function rerollTalent(ratIdx, slotIdx){
  var rat = SHOP.rats[ratIdx];
  if (!rat || !rat.talents || !rat.talents[slotIdx]) return null;
  if ((SHOP.shard | 0) < REROLL_COST){ sfx('invalid'); return null; }
  addShard(-REROLL_COST);
  var t = rat.talents[slotIdx];
  var from = t.lv || 1;
  var to = rollTalentGrade();
  t.lv = to;
  rebuildUnitsIfShop();
  shopSave();
  sfx(to > from ? 'pick' : 'invalid');
  return { from: from, to: to, id: t.id };
}

function fuseRats(mainIdx, subIdx){
  var pv = fusePreview(mainIdx, subIdx);
  if (!pv) return null;
  if (SHOP.coins < pv.cost){ sfx('invalid'); return null; }
  SHOP.coins -= pv.cost;

  var kept = [{ id: pv.slot1.id, lv: pv.slot1.lv }];   /* 槽1 职业天赋：免疫 */
  var lostSkills = [], lostTalents = [];

  /* 1) 技能：先判"被吃"（8%），再判继承（主 70% / 副 55%），同名合并升级 */
  function mergeSkill(t){
    for (var i = 0; i < kept.length; i++){
      if (kept[i].id === t.id){ kept[i].lv = Math.max(kept[i].lv, t.lv || 1); return; }
    }
    kept.push({ id: t.id, lv: t.lv || 1, isSkill: true });
  }
  var skAll = [];
  for (var i = 0; i < pv.skillsMain.length; i++) skAll.push({ t: pv.skillsMain[i], keep: pv.keepMain, who: '主' });
  for (var j = 0; j < pv.skillsSub.length; j++) skAll.push({ t: pv.skillsSub[j], keep: pv.keepSub, who: '副' });
  for (var k = 0; k < skAll.length; k++){
    var e = skAll[k];
    if (Math.random() < pv.eatSkill){ lostSkills.push(e.t); continue; }
    if (Math.random() < (e.keep || 0.6)) mergeSkill(e.t);
  }

  /* 2) 额外天赋：先判"被吃"（2.5%），再判继承（70%） */
  for (var m = 0; m < pv.extras.length; m++){
    var x = pv.extras[m];
    if (Math.random() < pv.eatTalent){ lostTalents.push(x); continue; }
    if (Math.random() < (x.chance || 0.6)){
      var merged = false;
      for (var n = 0; n < kept.length; n++){
        if (kept[n].id === x.id){ kept[n].lv = Math.max(kept[n].lv, x.lv || 1); merged = true; break; }
      }
      if (!merged) kept.push({ id: x.id, lv: x.lv || 1 });
    }
  }

  /* 3) 分开技能/天赋，各自按上限整理（技能不限、天赋最多 3 个槽） */
  var tal = [], sk = [];
  for (var q = 0; q < kept.length; q++) (kept[q].isSkill ? sk : tal).push(kept[q]);
  tal = tal.slice(0, 3);

  var main = SHOP.rats[mainIdx];
  var fused = {
    line: main.line, tier: main.tier, mod: '',
    talents: tal.map(function(t){ return { id: t.id, lv: t.lv }; }),
    skills: sk.map(function(t){ return { id: t.id, lv: t.lv }; })
  };
  SHOP.rats[mainIdx] = fused;
  SHOP.rats.splice(subIdx, 1);
  SHOP.squad = SHOP.squad.map(function(v){
    if (v === subIdx) return -1;
    return v > subIdx ? v - 1 : v;
  });
  SHOP.sel = Math.min(mainIdx, SHOP.rats.length - 1);

  var refunded = 0;
  var gotExtra = Math.max(0, tal.length - 1) + sk.length;
  if (!gotExtra){ refunded = pv.refund; addShard(refunded); }

  rebuildUnitsIfShop();
  shopSave();
  sfx('pick');
  return { fused: fused, gotExtra: gotExtra, refunded: refunded, kept: kept,
           lostSkills: lostSkills, lostTalents: lostTalents };
}

/* 新抽到的鼠：在补给站里挂一个 NEW 角标，进过详情就清掉 */
function markFresh(idx){
  SHOP.fresh = SHOP.fresh || {};
  SHOP.fresh[idx] = performance.now();
}
function isFresh(idx){
  return !!(SHOP.fresh && SHOP.fresh[idx]);
}
function clearFresh(idx){
  if (SHOP.fresh) delete SHOP.fresh[idx];
}

function decompRat(idx){
  var rat = SHOP.rats[idx];
  if (!rat) return 0;
  if (SHOP.squad.indexOf(idx) >= 0) return -1;     /* 场上的不能拆 */
  if (SHOP.rats.length <= 1) return -1;            /* 至少留一只 */
  var gain = shardValueOf(rat);
  SHOP.rats.splice(idx, 1);
  SHOP.squad = SHOP.squad.map(function(v){ return v === idx ? -1 : (v > idx ? v - 1 : v); });
  SHOP.sel = Math.max(0, Math.min(SHOP.sel, SHOP.rats.length - 1));
  addShard(gain);
  rebuildUnitsIfShop();
  shopSave();
  sfx('pick');
  return gain;
}

var SHOP_KEY = 'hamsterSnackFactory.shop.v2';
var SHOP_KEY_V1 = 'hamsterSnackFactory.shop.v1';
var SQUAD_SLOTS = function(){ return Math.max(1, CFG.slots || 5); };

var SHOP = {
  coins: 0,
  level: 1,
  best: 1,
  rats: [
    { line: 'tank', tier: 2, mod: '' },
    { line: 'shot', tier: 2, mod: '' }
  ],
  squad: [0, 1, -1, -1, -1],
  sel: 0,
  codex: false,
  offers: [],
  refreshLeft: 3,
  earned: 0
};

/* 编队工具：-1 = 空位；同一条线最多 compose.maxSameLine 只 */
function squadSlots(){ return SQUAD_SLOTS(); }
function squadOnCount(){
  var n = 0;
  for (var i = 0; i < SHOP.squad.length; i++) if (SHOP.squad[i] >= 0 && SHOP.rats[SHOP.squad[i]]) n++;
  return n;
}
function squadLineCount(line){
  var n = 0;
  for (var i = 0; i < SHOP.squad.length; i++){
    var r = SHOP.rats[SHOP.squad[i]];
    if (r && (r.line || 'none') === line) n++;
  }
  return n;
}
/* 队伍上限（仓鼠存栏数）：默认 12，抽卡满员才折碎片 */
/* ---------- 仓鼠盒：仓鼠栏（可上场，12）满了就往盒子里放 ---------- */
function boxCap(){
  var v = (RULES && RULES.boxCap);
  return (typeof v === 'number' && v > 0) ? Math.round(v) : 60;
}
function boxList(){
  if (!SHOP.box) SHOP.box = [];
  return SHOP.box;
}
function boxAdd(rat){
  var box = boxList();
  if (box.length >= boxCap()) return -1;
  box.push(rat);
  return box.length - 1;
}
/* 取出到仓鼠栏；栏满则返回 false */
function boxTake(idx){
  var box = boxList();
  var rat = box[idx];
  if (!rat) return false;
  if (SHOP.rats.length >= rosterCap()) return false;
  box.splice(idx, 1);
  SHOP.rats.push(rat);
  SHOP.sel = SHOP.rats.length - 1;
  markFresh(SHOP.sel);
  rebuildUnitsIfShop();
  shopSave();
  sfx('pick');
  return true;
}
function boxDecomp(idx){
  var box = boxList();
  var rat = box[idx];
  if (!rat) return 0;
  var gain = shardValueOf(rat);
  box.splice(idx, 1);
  addShard(gain);
  shopSave();
  sfx('pick');
  return gain;
}

function rosterCap(){
  var v = (RULES && RULES.rosterCap);
  return (typeof v === 'number' && v >= 6) ? Math.round(v) : 12;
}

/* 同线最多几只上场：白板（none）没有职业线，所以不占这条限制 */
function maxSameLine(line){
  if (line === 'none') return fieldCap();
  var c = (RULES.rpg || {}).compose || {};
  return Math.max(1, c.maxSameLine || 2);
}
function squadIndexOf(idx){
  for (var i = 0; i < SHOP.squad.length; i++) if (SHOP.squad[i] === idx) return i;
  return -1;
}
function squadFirstEmpty(){
  for (var i = 0; i < SHOP.squad.length; i++) if (!(SHOP.squad[i] >= 0)) return i;
  return -1;
}
function squadNormalize(){
  var slots = squadSlots(), out = [];
  for (var i = 0; i < slots; i++){
    var v = SHOP.squad[i];
    out.push((typeof v === 'number' && v >= 0 && v < SHOP.rats.length) ? v : -1);
  }
  SHOP.squad = out;
}

/* v2 → v3：配件下线（每个折 2 碎片），天赋槽1 补齐 */
function migrateRats(rats){
  var gained = 0;
  var cfg = (RULES && RULES.shard) || {};
  var per = cfg.legacyMod || 2;
  for (var i = 0; i < (rats || []).length; i++){
    var r = rats[i];
    if (!r) continue;
    if (r.mod){
      gained += per;
      r.mod = '';
    }
    if (typeof ensureTalentSlot1 === 'function') ensureTalentSlot1(r);
  }
  if (gained) addShard(gained);
  return gained;
}

function shopSave(){
  try {
    localStorage.setItem(SHOP_KEY, JSON.stringify({
      version: 3,
      coins: SHOP.coins, level: SHOP.level, best: SHOP.best,
      rats: SHOP.rats, squad: SHOP.squad, box: SHOP.box || [], gears: SHOP.gears || {},
      shard: SHOP.shard | 0, gachaPity: SHOP.gachaPity | 0, tier2Pity: SHOP.tier2Pity | 0
    }));
  } catch (e) {}
}

function shopLoad(){
  try {
    var raw = localStorage.getItem(SHOP_KEY);
    if (!raw) raw = localStorage.getItem(SHOP_KEY_V1);   // v1 → v2 迁移（squad 只有 2 位、没有 version）
    if (!raw) return;
    var o = JSON.parse(raw);
    if (!o || typeof o !== 'object') return;
    if (typeof o.coins === 'number') SHOP.coins = Math.max(0, o.coins);
    if (typeof o.level === 'number') SHOP.level = Math.max(1, o.level);
    if (typeof o.best === 'number') SHOP.best = Math.max(1, o.best);
    if (Array.isArray(o.rats) && o.rats.length){
      SHOP.rats = o.rats.map(function(r){
        var line = r && r.line;
        if (LINE_MIGRATE[line]) line = LINE_MIGRATE[line];   /* 老五线 → 新五线 */
        return {
          line: line || 'none',
          tier: Math.min(4, Math.max(1, (r && r.tier) || 1)),
          mod: (r && r.mod) || ''
        };
      });
    }
    if (Array.isArray(o.squad)) SHOP.squad = o.squad.slice();
    squadNormalize();
    if (!squadOnCount()){ SHOP.squad[0] = 0; }
    if (SHOP.sel >= SHOP.rats.length) SHOP.sel = 0;
  } catch (e) {}
  SHOP.box = Array.isArray(SHOP.box) ? SHOP.box : [];
  SHOP.gears = (SHOP.gears && typeof SHOP.gears === 'object') ? SHOP.gears : {};
  shardLoad();
  if (SHOP.rats && SHOP.rats.length) migrateRats(SHOP.rats);
}

var _shopBuildSquad = buildSquad;
buildSquad = function(){
  R.units = [];
  var slots = CFG.slots || 5;
  /* 编队里放了几只就上几只（最多 slots=5）。
     循序渐进靠"你一开始只有 2 只仓鼠 + 敌人一关比一关多"，不靠砍上场位 ——
     玩家凑齐 5 只就该看见 5 只站在台上。 */
  for (var s = 0; s < slots; s++){
    var idx = SHOP.squad[s];
    var rat = (typeof idx === 'number' && idx >= 0) ? SHOP.rats[idx] : null;
    if (!rat){ R.units.push(null); continue; }
    var u = makeUnit(ratId(rat), s);
    u.ratIndex = idx;
    ensureTalentSlot1(rat);
    u.talents = (rat.talents || []).slice();
    u.skills = (rat.skills || []).map(function(t){ return { id: t.id, lv: t.lv || 1, readyAt: 0 }; });
    u.rat = rat;
    applyMod(u, rat.mod);
    R.units.push(u);
  }
  for (var j = 0; j < R.units.length; j++) if (R.units[j]) R.units[j].slot = j;
};

/* 上场上限：编队位就是上限（5）。留这个函数给商店/顶栏读，避免各处自己算 */

/* 配件在"造单位"的时候一次性烤进数值，避免战斗中反复换算 */
function applyMod(u, modId){
  /* P1：配件不再出售，但老存档里残留的 mod 仍然按原规则生效（避免读档后手感突变） */
  var m = MODS[modId];
  if (!u || !m) return;
  u.modId = modId;
  if (m.dmgMul){
    u.baseDmg = Math.round(u.baseDmg * m.dmgMul);
    if (u.act && u.act.dmg){
      u.act = { kind: u.act.kind, dmg: Math.round(u.act.dmg * m.dmgMul), pierce: u.act.pierce, armor: u.act.armor };
    }
  }
  if (m.atkMul) u.atkMs = Math.max(400, Math.round(u.atkMs * m.atkMul));
  if (m.needMinus && u.need) u.need = Math.max(2, u.need - m.needMinus);
  if (m.basePlus) u.baseDmg = (u.baseDmg || 0) + m.basePlus;
  if (m.defMul) u.defMul = m.defMul;
}

var _shopApplyUnitDamage = applyUnitDamage;
applyUnitDamage = function(u, dmg, pierce, kind){
  if (u && u.defMul) dmg = Math.max(1, Math.round(dmg * u.defMul));
  return _shopApplyUnitDamage(u, dmg, pierce, kind);
};

/* 解锁池：证按关卡开放，别让第 1 关就刷到仓管专精证 */
function unlockedLines(lvl){
  /* 五条线全开：职业本身没有门槛，门槛放在"阶"上（见 maxTierFor）。
     留这个函数是为了以后做"章节解锁某条线"。 */
  return ['tank', 'blade', 'shot', 'hex', 'care'];
}
function allowTier3(lvl){ return lvl >= TIER_UNLOCK[3]; }

function rollOffers(){
  var lvl = SHOP.level || 1;
  var lines = unlockedLines(lvl);
  var maxTier = maxTierFor(lvl);
  var cand = [];
  for (var i = 0; i < lines.length; i++){
    for (var t = 2; t <= maxTier; t++){
      cand.push({ kind: 'gear', line: lines[i], tier: t, price: TIER_PRICE[t] });
    }
  }

  /* 保底：优先给"选中鼠现在就能用的下一阶证"，但别刷成固定一张
     —— 60% 出同线下一阶，40% 出别的可用证（换线也是合法养成路线）。
     四阶之后"下一阶"就是 +1，不会一次跳两级。 */
  var rat = SHOP.rats[SHOP.sel] || SHOP.rats[0] || null;
  var myTier = rat ? (rat.tier || 1) : 1;
  var nextTier = Math.min(4, myTier + 1);
  var sameLineNext = cand.filter(function(c){
    return rat && c.tier === nextTier && rat.line === c.line;
  });
  var sameTierAny = cand.filter(function(c){
    return !rat || rat.line !== c.line || (rat.tier || 1) !== c.tier - 1;
  });
  var pool;
  if (sameLineNext.length && Math.random() < 0.6) pool = sameLineNext;
  else if (sameTierAny.length) pool = sameTierAny;
  else pool = cand;
  var g = pool[Math.floor(Math.random() * pool.length)];

  SHOP.offers = [
    { kind: 'gear', line: g.line, tier: g.tier, price: g.price, sold: false },
    { kind: 'shard', amount: 2, price: 10, sold: false },
    { kind: 'rat', price: 35, sold: false }
  ];
}

function offerTitle(o){
  if (o.kind === 'gear') return (LINE_NAME[o.line] || '') + (TIER_LABEL[o.tier] || '') + '证';
  if (o.kind === 'shard') return '碎片包 ×' + (o.amount || 2);
  return '新仓鼠（白板）';
}

function offerDesc(o){
  if (o.kind === 'gear'){
    var id = VARIANT[o.line + '-' + o.tier];
    var nm = (ROSTER[id] && ROSTER[id].name) || '';
    if (o.tier >= 3) return '升到四级前必须逐阶转（' + nm + '）';
    return '转职为 ' + nm;
  }

  return '白板仓鼠，可再买证转职';
}

var _shopCheckEnd = checkBattleEnd;

};

function onLevelWin(){
  // 无限步之后，"剩余步数"不再存在：改用存活仓鼠数 + 护甲余量结算
  var coins = 12 + aliveUnits().length * 6 + (R.armor >= R.armorMax * 0.8 ? 8 : 0);
  SHOP.earned = coins;
  SHOP.coins += coins;
  SHOP.best = Math.max(SHOP.best, SHOP.level);
  shopSave();
}

/* 失败也进补给站，而且给保底收入——否则卡关 = 没钱 = 永远打不过的死循环 */
function onLevelLose(){
  var coins = 8 + R.kills * 3 + (R.wave + 1) * 4;
  SHOP.earned = coins;
  SHOP.coins += coins;
  shopSave();
}

function openShop(afterWin){
  if (S.phase === 'shop') return;      // 幂等：事件顺序兜底，别重复摇货架
  window.__counters.openShop++;
  SHOP.advance = afterWin !== false;   // true = 赢了，开工进下一关；false = 输了，重打本关
  if (SHOP.advance) onLevelWin(); else onLevelLose();
  S.phase = 'shop';
  SHOP.refreshLeft = 3;
  SHOP.sel = Math.min(SHOP.sel, SHOP.rats.length - 1);
  rollOffers();
  shopSave();
}

function startNextLevel(){
  SHOP.level += SHOP.advance === false ? 0 : 1;
  shopSave();
  // 正常流程里 rng 早就有了；这条只在测试/异常路径下兜底
  if (typeof S.rng !== 'function'){ S.seed = Date.now() & 0x7fffffff; S.rng = mulberry32(S.seed); }
  startLevel(SHOP.level);
}

/* ================= 仓鼠详情页（梦幻西游式宠物面板） ================= */
function ratStats(rat){
  var id = ratId(rat);
  var r = ROSTER[id] || ROSTER.worker;
  var tal = rat.talents || [];
  return {
    name: r.name || '工鼠',
    line: rat.line || 'none',
    tier: rat.tier || 1,
    hp: r.hp || 0,
    atkMs: r.atkMs || 0,
    baseDmg: r.baseDmg || 0,
    act: r.act ? r.act.dmg : 0,
    actKind: r.act ? r.act.kind : '',
    need: r.need || 0,
    eats: r.eats || '—',
    talents: tal
  };
}

function talentEffectText(id, lv){
  var def = TALENT_DEF[id];
  if (!def || !def.levels) return '';
  var o = def.levels[Math.max(0, Math.min(def.levels.length, lv) - 1)] || {};
  var names = { dr: '减伤', heal: '击杀回血', atk: '攻速', pierce: '穿甲', crit: '暴击',
                burn: '每秒灼烧', stack: '最大层数', amp: '易伤',
                overflow: '溢出转盾', armor: '盾上限', haste: '攻速增益' };
  var parts = [];
  for (var k in o){
    var v = o[k];
    if (k === 'dr' || k === 'pierce' || k === 'crit' || k === 'atk' || k === 'amp' || k === 'haste'){
      parts.push(names[k] + ' +' + Math.round(v * 100) + '%');
    } else {
      parts.push(names[k] + ' ' + v);
    }
  }
  return parts.join(' · ');
}

/* 四维雷达：生命 / 输出 / 续航 / 辅助（都按 0–1 归一，便于横向比较） */
function ratRadarStats(rat){
  var r = ROSTER[ratId(rat)] || {};
  var hp = r.hp || 1;
  var dmg = (r.baseDmg || 0) + ((r.act && r.act.dmg) || 0) * 1.2;
  var tal = rat.talents || [];
  var hasCare = tal.some(function(t){ return t.id === 'care'; });
  var hasHex = tal.some(function(t){ return t.id === 'hex'; });
  var hasBlade = tal.some(function(t){ return t.id === 'blade'; });
  var clamp01 = function(v){ return Math.max(0.08, Math.min(1, v)); };
  return [
    { k: '生命', v: clamp01(hp / 200) },
    { k: '输出', v: clamp01(dmg / 40) },
    { k: '续航', v: clamp01(0.25 + hp / 500 + (hasBlade ? 0.25 : 0)) },
    { k: '辅助', v: clamp01(0.2 + tal.length * 0.22 + (hasCare ? 0.25 : 0) + (hasHex ? 0.12 : 0)) }
  ];
}

function drawRatRadar(cx, cy, R, rat){
  var st = ratRadarStats(rat);
  var n = st.length;
  ctx.save();
  /* 背景网格：三层 */
  for (var ring = 1; ring <= 3; ring++){
    var rr0 = R * ring / 3;
    ctx.beginPath();
    for (var i = 0; i <= n; i++){
      var a = -Math.PI / 2 + (i % n) * (Math.PI * 2 / n);
      var x = cx + Math.cos(a) * rr0, y = cy + Math.sin(a) * rr0;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = ring === 3 ? 'rgba(232,172,80,.35)' : 'rgba(255,255,255,.09)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  for (var j = 0; j < n; j++){
    var ang = -Math.PI / 2 + j * (Math.PI * 2 / n);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(ang) * R, cy + Math.sin(ang) * R);
    ctx.strokeStyle = 'rgba(255,255,255,.08)';
    ctx.stroke();
  }
  /* 数据多边形 */
  ctx.beginPath();
  for (var k = 0; k <= n; k++){
    var idx = k % n;
    var a2 = -Math.PI / 2 + idx * (Math.PI * 2 / n);
    var rv = R * st[idx].v;
    var px = cx + Math.cos(a2) * rv, py = cy + Math.sin(a2) * rv;
    if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(232,172,80,.30)';
  ctx.fill();
  ctx.strokeStyle = '#ffd166';
  ctx.lineWidth = 1.6;
  ctx.stroke();
  /* 顶点小方块 + 轴标签 */
  for (var m = 0; m < n; m++){
    var a3 = -Math.PI / 2 + m * (Math.PI * 2 / n);
    var vx = cx + Math.cos(a3) * R * st[m].v, vy = cy + Math.sin(a3) * R * st[m].v;
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(Math.round(vx) - 2, Math.round(vy) - 2, 4, 4);
    var lx = cx + Math.cos(a3) * (R + 12), ly = cy + Math.sin(a3) * (R + 10);
    txt(st[m].k, lx, ly + 4, Math.max(8, Math.round(W * 0.023)), C.muted, 'center');
  }
  ctx.restore();
}

/* 取某只鼠的像素贴图（没有就返回 null） */
function ratArtImg(rat){
  if (!rat) return null;
  var line = rat.line || 'none';
  var tier = rat.tier || 1;
  /* 白板鼠（tier 1）没有分线贴图，统一用 none-1 的样子；
     再兜一层到本线二级图，最后才让调用方退回矢量。 */
  var keys = [line + '-' + tier, 'none-1', line + '-2'];
  return (typeof artFromMap === 'function') ? artFromMap(unitArtMap(), keys) : null;
}

/* 在 (cx, cy) 画一只鼠（贴图优先，矢量兜底），size 为边长 */
function drawRatAt(rat, cx, cy, size, alpha){
  var img = ratArtImg(rat);
  ctx.save();
  if (typeof alpha === 'number') ctx.globalAlpha = alpha;
  if (img){
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, Math.round(cx - size / 2), Math.round(cy - size / 2), size, size);
  } else if (typeof drawHamsterArt === 'function'){
    drawHamsterArt(cx - size * 0.5, cy - size * 0.42, size * 0.9,
                   { line: rat && rat.line, cls: rat && rat.line, tier: rat && rat.tier });
  }
  ctx.restore();
}

/* 天赋串：硬化Ⅲ 复苏Ⅱ */
function talentText(rat){
  var ts = (rat && rat.talents) || [];
  var roman = ['Ⅰ', 'Ⅱ', 'Ⅲ'];
  return ts.map(function(t){
    return (TALENT_DEF[t.id] ? TALENT_DEF[t.id].name : t.id) + roman[(t.lv || 1) - 1];
  }).join(' ');
}

/* ---------- 抽卡揭示动画（纯代码绘制） ----------
   0–420ms 卡背脉动 → 420–720ms 翻牌 → 720–1200ms 结果亮相（Ⅲ 级金色爆光） */
var REVEAL = { t0: 0, results: [], t3: '', pre: 0 };

function revealActive(){ return REVEAL.results.length > 0 && performance.now() - REVEAL.t0 < 2200; }

function startReveal(results){
  if (!results || !results.length) return;
  REVEAL.results = results.slice(0, 10);
  REVEAL.t0 = performance.now();
  REVEAL.pre = 320;                 /* 先播 0.32s 的"机器启动"，再翻牌 */
  REVEAL.t3 = '';
  for (var i = 0; i < REVEAL.results.length; i++){
    if (REVEAL.results[i].t3){ REVEAL.t3 = REVEAL.results[i].t3; break; }
  }
  sfx('gachaFlip');
  if (REVEAL.t3){
    setTimeout(function(){ try { sfx('gachaGold'); } catch (e) {} }, 700);
  } else {
    setTimeout(function(){ try { sfx('pick'); } catch (e) {} }, 620);
  }
}

function drawGachaReveal(){
  var now = performance.now();
  var age0 = now - REVEAL.t0;
  var pre = REVEAL.pre || 0;
  var list = REVEAL.results;

  /* 启动帧：投币 + 扫描线，给抽卡一个"仪式感" */
  if (age0 < pre){
    var k0 = age0 / Math.max(1, pre);
    ctx.save();
    ctx.fillStyle = 'rgba(10,8,16,.92)';
    ctx.fillRect(0, 0, W, H);
    var cx0 = W / 2, cy0 = H * 0.42;
    ctx.strokeStyle = 'rgba(232,172,80,' + (0.35 + 0.45 * Math.abs(Math.sin(now / 90))) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx0, cy0, 42, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx0, cy0, 30, now / 220, now / 220 + Math.PI * 1.2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    ctx.fillRect(0, H * 0.42 - 2 + Math.sin(now / 120) * 60, W, 3);
    txt('投币…', W / 2, cy0 + 80, Math.max(11, Math.round(W * 0.032)), '#ffd98a', 'center', true);
    ctx.restore();
    shopHit(0, 0, W, H, function(){ REVEAL.t0 = 0; REVEAL.results = []; sfx('tap'); });
    return;
  }
  var age = age0 - pre;
  ctx.save();
  ctx.fillStyle = 'rgba(10,8,16,.88)';
  ctx.fillRect(0, 0, W, H);
  /* 全屏"点一下关闭"先注册，后面的「去编队」按钮才能压在它上面 */
  shopHit(0, 0, W, H, function(){ REVEAL.results = []; sfx('tap'); });

  var cols = list.length > 5 ? 5 : list.length;
  var rows = Math.ceil(list.length / cols);
  var cell = list.length > 1 ? 58 : 108;
  var gapX = 8, gapY = 12;
  var gridW = cols * cell + (cols - 1) * gapX;
  var gridH = rows * cell + (rows - 1) * gapY;
  var x0 = (W - gridW) / 2, y0 = H * 0.34 - gridH / 2 + 40;

  for (var i = 0; i < list.length; i++){
    var r = list[i];
    var t = age - 420 - i * 55;                 /* 每张错开翻牌 */
    var cx = x0 + (i % cols) * (cell + gapX) + cell / 2;
    var cy = y0 + Math.floor(i / cols) * (cell + gapY) + cell / 2;

    if (t < 0){
      /* 卡背 */
      var pulse = 0.9 + 0.1 * Math.sin(now / 180 + i);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(pulse, pulse);
      rr(-cell / 2 + 2, -cell / 2 + 2, cell - 4, cell - 4, 10);
      ctx.fillStyle = 'rgba(232,172,80,.14)'; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(232,172,80,.55)'; ctx.stroke();
      txt('?', 0, 6, Math.round(cell * 0.42), 'rgba(232,172,80,.75)', 'center', true);
      ctx.restore();
    } else {
      /* 翻牌：横向从 0 展开 */
      var k = Math.min(1, t / 260);
      var sx = Math.abs(Math.cos(k * Math.PI));   /* 0→1→0 的翻页感 */
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(Math.max(0.02, sx), 1);
      rr(-cell / 2 + 2, -cell / 2 + 2, cell - 4, cell - 4, 10);
      ctx.fillStyle = r.t3 ? 'rgba(232,172,80,.22)' : 'rgba(255,255,255,.05)'; ctx.fill();
      ctx.lineWidth = r.t3 ? 2.5 : 1;
      ctx.strokeStyle = r.t3 ? '#ffd166' : 'rgba(255,255,255,.18)';
      ctx.stroke();
      ctx.restore();

      if (k >= 1){
        drawRatAt(r.rat, cx, cy - (list.length > 1 ? 6 : 10), cell * (list.length > 1 ? 0.72 : 0.8), 1);
        if (list.length === 1){
          txt((LINE_NAME[r.rat.line] || '') + ' · ' + (TIER_LABEL[r.rat.tier || 1] || ''),
              cx, cy + cell * 0.42, Math.round(W * 0.032), C.ink, 'center', true);
          txt(talentText(r.rat), cx, cy + cell * 0.55, Math.round(W * 0.028), '#ffd98a', 'center');
        }
      }
    }
  }

  /* Ⅲ 级爆光 */
  if (REVEAL.t3 && age > 700){
    var a = Math.min(1, (age - 700) / 300);
    ctx.save();
    ctx.globalAlpha = a * (0.75 + 0.25 * Math.sin(now / 160));
    var g = ctx.createRadialGradient(W / 2, H * 0.34, 10, W / 2, H * 0.34, W * 0.8);
    g.addColorStop(0, 'rgba(255,209,102,.55)');
    g.addColorStop(1, 'rgba(255,209,102,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
    txt('★NEW★ Ⅲ 级天赋 · ' + REVEAL.t3, W / 2, H * 0.16,
        Math.round(W * 0.045), '#ffd166', 'center', true);
  }

  /* 结果去向：加入队伍 / 满员折碎片 */
  var joined = 0, sharded = 0, boxedN = 0;
  for (var qi = 0; qi < list.length; qi++){
    if (list[qi].shard) sharded += list[qi].shard;
    else if (list[qi].boxed) boxedN++;
    else joined++;
  }
  var fy = H * 0.74;
  var msgParts = [];
  if (joined) msgParts.push('进仓鼠栏 ' + joined + ' 只');
  if (boxedN) msgParts.push('进仓鼠盒 ' + boxedN + ' 只');
  if (sharded) msgParts.push('折成 ' + sharded + ' 碎片');
  var msg = msgParts.join(' · ') + '（栏 ' + SHOP.rats.length + '/' + rosterCap() +
            ' · 盒 ' + boxList().length + '/' + boxCap() + '）';
  txt(msg, W / 2, fy, Math.max(10, Math.round(W * 0.028)), joined ? '#79c98a' : '#c7b6ff', 'center', true);

  if (joined){
    var gbW = 132, gbH = 34, gbX = W / 2 - gbW / 2, gbY = fy + 14;
    rr(gbX, gbY, gbW, gbH, 17);
    ctx.fillStyle = C.amber; ctx.fill();
    txt('去编队 →', W / 2, gbY + 23, Math.max(11, Math.round(W * 0.03)), '#241d2e', 'center', true);
    shopHit(gbX, gbY, gbW, gbH, function(){
      REVEAL.results = [];
      SHOP.page = '';
      if (typeof list[0].index === 'number') SHOP.sel = list[0].index;
      sfx('tap');
    });
  }

  txt(list.length > 1 ? '十连结果 · 点屏幕继续' : '点屏幕继续', W / 2, H * 0.90,
      Math.max(10, Math.round(W * 0.03)), C.muted, 'center');
  ctx.restore();
}

function drawFuseAnim(){
  var a = FUSE.anim;
  var age = performance.now() - a.t0;
  var cx = W / 2, cy = H * 0.42;
  ctx.save();
  ctx.fillStyle = 'rgba(10,8,16,.90)';
  ctx.fillRect(0, 0, W, H);

  var k = Math.min(1, age / 520);
  var ease = 1 - Math.pow(1 - k, 3);
  var spread = (1 - ease) * (W * 0.34) + 6;

  if (age < 520){
    drawRatAt(a.main, cx - spread, cy, 96, 1);
    drawRatAt(a.sub, cx + spread, cy, 96, 1);
    /* 拖尾 */
    ctx.strokeStyle = 'rgba(232,172,80,.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - spread - 40, cy); ctx.lineTo(cx - spread - 8, cy);
    ctx.moveTo(cx + spread + 40, cy); ctx.lineTo(cx + spread + 8, cy);
    ctx.stroke();
  } else if (age < 700){
    var f = (age - 520) / 180;
    ctx.save();
    ctx.globalAlpha = 1 - f * 0.3;
    var g = ctx.createRadialGradient(cx, cy, 4, cx, cy, W * (0.25 + f * 0.5));
    g.addColorStop(0, 'rgba(255,255,255,' + (0.95 - f * 0.5) + ')');
    g.addColorStop(1, 'rgba(232,172,80,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  } else {
    var p = Math.min(1, (age - 700) / 420);
    var scale = 0.6 + 0.4 * p;
    drawRatAt(a.res, cx, cy, 120 * scale, Math.min(1, p * 1.6));
    ctx.save();
    ctx.globalAlpha = 1 - p;
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx, cy, 60 + p * 90, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
    if (p > 0.5){
      txt('炼妖成功', cx, H * 0.62, Math.round(W * 0.045), '#ffd166', 'center', true);
      txt(talentText(a.res), cx, H * 0.68, Math.round(W * 0.032), C.ink, 'center');
      txt(a.gotExtra ? ('继承了 ' + a.gotExtra + ' 条额外天赋') : ('没继承额外天赋，返还 ' + a.refunded + ' 碎片'),
          cx, H * 0.73, Math.max(10, Math.round(W * 0.028)), C.muted, 'center');
    }
  }

  txt('点屏幕跳过', W / 2, H * 0.88, Math.max(9, Math.round(W * 0.026)), '#6a6480', 'center');
  ctx.restore();
  shopHit(0, 0, W, H, function(){ FUSE.anim = null; sfx('tap'); });
}

/* 底部说明卡：把"抽 → 分解 → 洗练 → 炼妖"这条循环讲清楚 */
function drawLoopTips(pad, y, w){
  var h = 92;
  rr(pad, y, w, h, 12);
  ctx.fillStyle = 'rgba(255,255,255,.03)'; ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.stroke();

  ];

    txt('· ' + lines[i], pad + 12, y + 40 + i * 17,
